; Waveshare ESP32-P4-WIFI6 with ESP32-C6 co-processor for BLE/WiFi, hand-wired SX1262-class LoRa,
; and GEP-M10-DI GNSS/barometer. Personal defaults belong in a private env, not here.
[env:waveshare-p4-wifi6]
extends = esp32p4_base
board = esp32-p4
board_level = extra
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = WAVESHARE_P4_WIFI6
custom_meshtastic_architecture = esp32-p4
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Waveshare ESP32-P4-WIFI6 + LoRa (DIY)

build_flags =
  ${esp32p4_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32p4/diy/waveshare_p4_wifi6
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  -DMESHTASTIC_EXCLUDE_AUDIO=1

lib_ignore =
  ${esp32p4_base.lib_ignore}
  ESP32 Codec2
