; Seeed XIAO ESP32-C6 + XL1262 (SX1262-class) LoRa module, hand-wired on the D0..D7 header. DIY build.
; Hardware only: personal defaults (owner, region, fixed position, WiFi) go into userPrefs.jsonc or a
; private env that extends this one - never into a variant file.
[env:xiao-c6-xl1262]
extends = esp32c6_base
board = seeed_xiao_esp32c6
board_level = extra
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = XIAO_C6_XL1262
custom_meshtastic_architecture = esp32-c6
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Seeed XIAO C6 + XL1262 (DIY)

build_flags =
  ${esp32c6_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32c6/diy/xiao_c6_xl1262
  ; ESP32-C6 with 4MB flash is tight: no screen, no audio (same as tlora_c6)
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  -DMESHTASTIC_EXCLUDE_AUDIO=1

lib_ignore =
  ${esp32c6_base.lib_ignore}
  ESP32 Codec2
