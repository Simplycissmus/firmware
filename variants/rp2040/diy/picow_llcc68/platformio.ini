; Raspberry Pi Pico W + SX1262-class (LLCC68) LoRa module + GEPRC GEP-M10-DI, hand-wired on the header at the same
; physical positions as the Waveshare ESP32-P4-WIFI6 node (Pico form factor), so one harness fits both boards.
; Derived from rpipicow (WiFi over the CYW43); LoRa on SPI0 instead of the Waveshare-HAT SPI1 layout.
[env:picow-llcc68]
extends = rp2040_base
board = rpipicow
board_level = extra
upload_protocol = picotool
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = PICOW_LLCC68
custom_meshtastic_architecture = rp2040
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Raspberry Pi Pico W + LoRa (DIY)

build_flags =
  ${rp2040_base.build_flags}
  -D RPI_PICO
  -D PRIVATE_HW
  -I variants/rp2040/diy/picow_llcc68
  -D HAS_UDP_MULTICAST=1
  -fexceptions  # for exception handling in MQTT
build_src_filter = ${rp2040_base.build_src_filter} +<mesh/wifi/>
lib_deps =
  ${rp2040_base.lib_deps}
  ${networking_base.lib_deps}
  ${networking_extra.lib_deps}
